<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shera Gong - Binghamton University</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #006747;
      --cream: #faf8f4;
      --ink: #1a1a1a;
      --muted: #5a5a5a;
      --border: #d8d2c8;
      --nav-h: 52px;
    }

    body {
      font-family: 'Source Serif 4', Georgia, serif;
      background: var(--cream);
      color: var(--ink);
      font-size: 16.5px;
      line-height: 1.75;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--green);
      height: var(--nav-h);
      display: flex;
      align-items: center;
    }
    .nav .inner {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 0 32px;
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .nav a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-family: 'Source Serif 4', serif;
      font-size: 0.88rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 3px;
      transition: background 0.18s, color 0.18s;
    }
    .nav a:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .nav .spacer { flex: 1; }

    .header {
      background: var(--cream);
      border-bottom: 1px solid var(--border);
      padding: 52px 32px 44px;
      text-align: center;
    }
    .header h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 10px;
    }
    .header .institution {
      font-family: 'Source Serif 4', serif;
      font-size: 1.4rem;
      font-weight: 700;
      font-style: italic;
      color: var(--green);
      letter-spacing: 0.01em;
    }
